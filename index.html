<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Ambulance Crash Alert System</title>
  <style>
    * { box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background: #121212; color: #ffffff; text-align: center; margin: 0; padding: 20px; }
    h1 { color: #ff4d4d; margin-bottom: 5px; }
    p { color: #aaaaaa; margin-top: 0; }
    
    .card { background: #1e1e1e; padding: 20px; border-radius: 12px; margin: 20px auto; max-width: 380px; border: 1px solid #333; }
    input { width: 95%; padding: 12px; margin: 8px 0; border-radius: 6px; border: 1px solid #444; background: #2a2a2a; color: white; font-size: 14px; }
    button { background: #ff4d4d; color: white; border: none; padding: 14px 20px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; width: 95%; margin-top: 10px; }
    
    .status-banner { padding: 20px; font-size: 20px; font-weight: bold; border-radius: 8px; margin-top: 15px; background: #2a2a2a; color: #00ffcc; }
    .crash-active { background: #ff0000 !important; color: #fff !important; animation: blink 0.3s infinite; }
    
    .gforce-val { font-size: 32px; font-weight: bold; color: #ffaa00; margin: 10px 0; }
    
    @keyframes blink {
      0% { opacity: 1; }
      50% { opacity: 0.2; }
      100% { opacity: 1; }
    }
  </style>
</head>
<body>

  <h1>🚑 Smart Ambulance Safety</h1>
  <p>Real-Time Impact & Emergency Hospital Alert</p>

  <!-- TELEGRAM SETUP BOX -->
  <div class="card" id="setup-card">
    <h3>Hospital System Setup</h3>
    <input type="text" id="botToken" placeholder="Telegram Bot Token">
    <input type="text" id="chatId" placeholder="Telegram Chat ID">
    <button onclick="startSystem()">ARM CRASH SYSTEM</button>
  </div>

  <!-- LIVE SENSOR STATUS -->
  <div class="card">
    <h3>Live G-Force Impact Sensor</h3>
    <div id="gforce-display" class="gforce-val">0.0 m/s²</div>
    <div id="sensor-banner" class="status-banner">SYSTEM OFFLINE</div>
  </div>

  <!-- EMERGENCY SIREN -->
  <audio id="siren-sound" src="https://actions.google.com/sounds/v1/emergency/emergency_siren_short.ogg" preload="auto"></audio>

  <script>
    let crashReported = false;

    function startSystem() {
      const token = document.getElementById("botToken").value.trim();
      const chatId = document.getElementById("chatId").value.trim();

      if (!token || !chatId) {
        alert("Please enter both your Telegram Bot Token and Chat ID.");
        return;
      }

      document.getElementById("setup-card").style.display = "none";
      document.getElementById("sensor-banner").innerText = "🟢 MONITORING FOR COLLISIONS";

      // Request Accelerometer Permissions (Required for iOS Safari)
      if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
        DeviceMotionEvent.requestPermission().then(response => {
          if (response === 'granted') {
            window.addEventListener('devicemotion', handleMotion);
          } else {
            alert("Permission to access motion sensors was denied.");
          }
        });
      } else {
        window.addEventListener('devicemotion', handleMotion);
      }
    }

    function handleMotion(event) {
      let acc = event.accelerationIncludingGravity;
      if (!acc) return;

      // Calculate total impact magnitude across X, Y, Z axes
      let totalAccel = Math.sqrt(acc.x * acc.x + acc.y * acc.y + acc.z * acc.z);

      // Live updates for G-force readout
      document.getElementById("gforce-display").innerText = totalAccel.toFixed(1) + " m/s²";

      // Impact Threshold: G-Force > 25 m/s² indicates a severe collision
      if (totalAccel > 25 && !crashReported) {
        crashReported = true;
        
        const sensorBanner = document.getElementById("sensor-banner");
        sensorBanner.innerText = "🚨 CRASH DETECTED! ALERT SENT!";
        sensorBanner.className = "status-banner crash-active";
        
        // Play local emergency siren sound
        document.getElementById("siren-sound").play();

        // Send alert payload to Telegram
        sendHospitalAlert(totalAccel);

        // Reset system monitor after 8 seconds
        setTimeout(() => { 
          crashReported = false; 
          sensorBanner.innerText = "🟢 MONITORING FOR COLLISIONS"; 
          sensorBanner.className = "status-banner";
        }, 8000);
      }
    }

    function sendHospitalAlert(force) {
      const token = document.getElementById("botToken").value.trim();
      const chatId = document.getElementById("chatId").value.trim();

      // Get phone GPS location
      navigator.geolocation.getCurrentPosition(
        (position) => {
          let lat = position.coords.latitude;
          let lon = position.coords.longitude;
          let mapLink = `https://www.google.com/maps?q=${lat},${lon}`;
          
          let message = `🚨 *ACCIDENT ALERT: AMBULANCE #1*%0A%0A` +
                        `💥 Impact Magnitude: ${force.toFixed(1)} m/s²%0A` +
                        `📍 Live GPS Coordinates: ${mapLink}`;

          fetch(`https://api.telegram.org/bot${token}/sendMessage?chat_id=${chatId}&text=${message}&parse_mode=Markdown`);
        },
        () => {
          // Fallback if GPS permissions are denied or unavailable
          let message = `🚨 *ACCIDENT ALERT: AMBULANCE #1*%0A%0A💥 Impact Magnitude: ${force.toFixed(1)} m/s²%0A📍 Location: GPS Signal Unavailable`;
          fetch(`https://api.telegram.org/bot${token}/sendMessage?chat_id=${chatId}&text=${message}&parse_mode=Markdown`);
        }
      );
    }
  </script>
</body>
</html>
